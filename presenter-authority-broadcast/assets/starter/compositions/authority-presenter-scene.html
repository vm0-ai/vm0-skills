<!doctype html>
<html lang="en" data-composition-id="authority-presenter-scene" data-composition-duration="6">
  <head>
    <meta charset="UTF-8" />
    <title>Authority Broadcast adaptive presenter scene</title>
  </head>
  <body>
    <template>
      <style>
        #root .scene-copy {
          --authority-content-max-width: 1100px;
          display: grid;
          justify-items: start;
          gap: 40px;
          text-align: left;
        }

        #root .authority-display {
          max-width: 1080px;
          font-size: 126px;
          text-wrap: balance;
        }

        #root .authority-body {
          width: min(100%, 1060px);
          font-size: 40px;
          text-wrap: balance;
        }

        #root .authority-content-line {
          display: block;
          transform: translate(var(--hf-line-x, 0px), var(--hf-line-y, 0px));
          filter: blur(var(--hf-line-blur, 0px));
          will-change: transform, filter, opacity;
        }
      </style>

      <div id="root" data-composition-id="authority-presenter-scene" data-width="1920" data-height="1080" data-duration="6">
        <main
          class="authority-frame" data-color-system="authority-broadcast"
          data-presenter="on"
          data-presenter-layout="side-right"
          data-title-chrome="off"
        >
          <section class="authority-content-stage">
            <div class="authority-content scene-copy">
              <p class="authority-kicker authority-content-line">Public service briefing</p>
              <h1 class="authority-display">
                <span class="authority-content-line">Put the explanation</span>
                <span class="authority-content-line">beside the speaker.</span>
              </h1>
              <p class="authority-body authority-content-line">The shared stage reserves a proportional presenter lane while the complete content remains vertically centered in the available region.</p>
            </div>
          </section>

          <div class="presenter-slot" data-presenter-crop="full" data-face-safe="true" data-presenter-media="static">
            <img class="presenter-media" src="assets/authority-broadcast/presenters/p1.png" alt="" />
          </div>
        </main>
      </div>

      <script>
        (() => {
          "use strict";
          const root = document.currentScript.previousElementSibling;
          const tl = gsap.timeline({ paused: true });

          // The presenter is spatially settled from frame one. Only the
          // semantic text layer uses the Registry-derived reveal behavior.
          tl.fromTo(
            root.querySelectorAll(".authority-content-line"),
            { opacity: 0, "--hf-line-x": "0px", "--hf-line-y": "24px", "--hf-line-blur": "6px" },
            {
              opacity: 1,
              "--hf-line-x": "0px",
              "--hf-line-y": "0px",
              "--hf-line-blur": "0px",
              duration: 0.34,
              stagger: 0.08,
              ease: "power3.out",
            },
            0,
          );

          window.__timelines["authority-presenter-scene"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
